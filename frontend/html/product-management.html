<!doctype html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css" />
    <title>Product Management | Nadeesakul</title>
    <style>
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(16, 32, 51, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.16);
        }
        th, td {
            padding: 0.9rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(56, 189, 248, 0.14);
        }
        th {
            background: rgba(232, 246, 255, 0.75);
            color: var(--accent-amber);
            font-weight: 600;
            font-size: 0.9rem;
        }
        td { font-size: 0.9rem; vertical-align: middle; }
        .action-btns { display: flex; gap: 0.5rem; align-items: center; }
        .btn-sm {
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
            border: none;
            color: white;
            text-decoration: none;
            font-family: var(--font-sans);
            white-space: nowrap;
        }
        .btn-edit { background: var(--accent-blue); color: var(--text-main); }
        .btn-delete { background: #ef4444; }
        .prod-img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; }
        td .desc-cell { max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text-muted); }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/" class="logo">Nadeesakul Admin</a>
            <nav>
                <ul>
                    <li><a href="/product-management" class="active">จัดการสินค้า</a></li>
                    <li><a href="#" id="logoutBtn">ออกจากระบบ</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container" style="max-width: 1400px;">
            <div class="admin-header">
                <h2 style="font-size:2rem; margin:0;">การจัดการสินค้า</h2>
                <a href="/add-product" class="btn-primary">+ เพิ่มสินค้าใหม่</a>
            </div>

            <!-- Breadcrumb -->
            <div id="pm-breadcrumb" class="drill-breadcrumb" style="display:none;"></div>

            <!-- Dynamic content (type cards → brand cards → products table) -->
            <div id="pm-content">
                <p style="text-align:center; color:var(--text-muted); padding: 2rem 0;">กำลังโหลด...</p>
            </div>
        </div>
    </main>

    <script src="/product.js"></script>
</body>
</html>
